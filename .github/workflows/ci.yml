name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 is not a preference. @inrupt/solid-client excludes 24 and
      # @inrupt/solid-client-authn-core excludes 20, so 22 is the only overlap;
      # jsdom sets the floor at 22.22.2. See docs/versions.md.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The build reads the Pod: generateStaticParams needs the trip list, and
      # decision 22 accepts that coupling deliberately. So CI needs a Pod, or
      # `build` fails here for reasons that have nothing to do with the change.
      # This also lets the integration test actually run instead of skipping.
      - name: Start a local Community Solid Server
        run: |
          npm run pod:dev > /tmp/pod.log 2>&1 &
          for i in $(seq 1 30); do
            sleep 2
            curl -sf -o /dev/null http://localhost:3001/ && break
          done
          curl -sf -o /dev/null http://localhost:3001/ || { cat /tmp/pod.log; exit 1; }

      - name: Seed it with the §7 fixtures
        run: |
          SEED_NAME=ci npm run pod:seed
          {
            echo "POD_ROOT=http://localhost:3001/ci/"
            echo "OWNER_WEBID=http://localhost:3001/ci/profile/card#me"
            echo "SITE_NAME=Travel diary"
            echo "SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (includes the guardrail-enforcement tests)
        run: npm test

      # The data model is normative. These two stop it drifting from the code.
      - name: Fixtures in docs/data-model.md are valid
        run: npm run validate:fixtures

      - name: lib/vocab.ts matches the data model, both directions
        run: npm run check:vocab

      - name: CLAUDE.md commands all exist in package.json
        run: npm run check:commands

      - name: Structure
        run: npm run check:structure

      - name: Build
        run: npm run build

      # What a public page actually ships, and the only bundle budget there is.
      # The studio is allowed to be heavy — it is behind a login, loaded once,
      # and its weight is mostly the Solid auth library, which invariant 4
      # requires to be in the browser. A second, whole-app step used to sit
      # above this one; it globbed every chunk under the name "public routes",
      # so it measured the studio and called it public, and it had been failing
      # at 359 kB against a 200 kB limit. Removed 2026-09-05 rather than
      # renumbered: see TODO.md.
      - name: Bundle budget (public routes)
        run: npm run size:public
